name: Publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate-package-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install validation and runtime dependencies
        run: >-
          python -m pip install
          -r requirements-dev.txt
          -r distributions/ai-platform/deck-builder/requirements.txt

      - name: Validate and package skill
        shell: pwsh
        run: ./scripts/validate-and-package.ps1 -Python '${{ steps.setup-python.outputs.python-path }}'

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' --verify-tag --generate-notes --title '${{ github.ref_name }} - Business-Aligned PowerPoint Skill'
          gh release upload '${{ github.ref_name }}' dist/deck-builder.zip
