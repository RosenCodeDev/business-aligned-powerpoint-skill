name: Validate recovered deck-builder skill

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation and runtime dependencies
        run: >-
          python -m pip install
          -r requirements-dev.txt
          -r distributions/ai-platform/deck-builder/requirements.txt

      - name: Validate and package skill
        shell: pwsh
        run: ./scripts/validate-and-package.ps1 -Python (Join-Path $env:pythonLocation 'python.exe')

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: deck-builder-skill-archive
          path: dist/deck-builder.zip
          if-no-files-found: error
